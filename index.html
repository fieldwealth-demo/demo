<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field · Demo</title>
<link rel="icon" href="assets/8f99cbc40910eb5b19d0fd6ef8b085ec.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<script>
  /* The site opens on the advisor app. ?persona=firm or ?persona=ops opens another seat;
     switching seats inside the demo (name at the bottom left) lasts until the page is reloaded. */
  (function () {
    try {
      var p = new URLSearchParams(location.search).get('persona');
      localStorage.setItem('field.persona', p && /^(advisor|firm|ops)$/.test(p) ? p : 'advisor');
    } catch (e) {}
  })();
</script>
<script src="proto/vendor/react.production.min.js"></script>
<script src="proto/vendor/react-dom.production.min.js"></script>
<link rel="stylesheet" href="proto/colors_and_type.css">
<link rel="stylesheet" href="proto/vendor/fontawesome.css">
<link rel="stylesheet" href="proto/app.r133.css">
<script src="proto/vendor/d3.min.js"></script>
<script src="proto/vendor/topojson-client.min.js"></script>
<script src="proto/vendor/highcharts.js"></script>
<script src="proto/vendor/highcharts-more.js"></script>
<script>
  /* Loads the app scripts in order, then mounts. The internal-ops seat is Morgan Ellis at Alpine
     Partners: these swaps update the r133 files in place until the next full build is uploaded. */
  (function () {
    var SWAPS = [
      ["name: 'Kyung Min',\n  role: 'Internal ops',\n  org: 'Field',\n  email: 'kyung@fieldwealth.ai',\n  init: 'KM',",
       "name: 'Morgan Ellis',\n  role: 'Internal ops',\n  org: 'Alpine Partners',\n  email: 'morgan.ellis@alpinepartners.com',\n  init: 'ME',"],
      ['"fontSize":"22px","fontWeight":"600"}}, "KM")', '"fontSize":"22px","fontWeight":"600"}}, "ME")'],
      ['Kyung Min (Super User)', 'Morgan Ellis (Super User)'],
      ['kyung@fieldwealth.ai', 'morgan.ellis@alpinepartners.com'],
      ['Internal ops · Field', 'Internal ops · Alpine Partners'],
      ['Kyung Min', 'Morgan Ellis'],
      ['Kyung Asset test', 'Sandbox Asset test'],
      ['Kyung Tenant', 'Sandbox Tenant'],
      ['Kyung Household', 'Sandbox Household']
    ];
    var FILES = [['proto/app-ui.r133.js', 1], ['proto/field-data.js', 0], ['proto/app-data-views.r133.js', 1], ['proto/app-firm.r133.js', 0], ['proto/app-ops.r133.js', 1]];
    function run(i) {
      if (i >= FILES.length) {
        (function go() {
          var el = document.getElementById('root');
          if (el && window.__protoMount) window.__protoMount(el);
          else setTimeout(go, 50);
        })();
        return;
      }
      var url = FILES[i][0], swap = FILES[i][1];
      if (!swap) {
        var s = document.createElement('script');
        s.src = url;
        s.onload = function () { run(i + 1); };
        document.head.appendChild(s);
        return;
      }
      fetch(url).then(function (r) { return r.text(); }).then(function (t) {
        SWAPS.forEach(function (p) { t = t.split(p[0]).join(p[1]); });
        var s = document.createElement('script');
        s.textContent = t + '\n//# sourceURL=' + url;
        document.head.appendChild(s);
        run(i + 1);
      });
    }
    run(0);
  })();
</script>
<style>body{margin:0}</style>
</head>
<body>
<div id="root" style="min-height:100vh"></div>
</body>
</html>
